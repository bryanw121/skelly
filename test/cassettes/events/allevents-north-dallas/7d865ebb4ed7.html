<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What are the best things to do for Christmas in Mckinney in 2026?","acceptedAnswer":{"@type":"Answer","text":"The most popular Christmas events in Mckinney in 2026 are Christmas in The Square 2026- Choreographed Light Show Presented by CoServ (Nov 20 – Dec 4), Dr. Seuss' How The Grinch Stole Christmas - The Musical at Music Hall At Fair Park (Sat, Nov 28) and WINTER WONDERLAND MARKET (Sun, Dec 6). Beyond those, the city's Christmas season brings light displays, holiday markets, Santa visits and carol concerts."}},{"@type":"Question","name":"Where can I see Christmas lights in Mckinney in 2026?","acceptedAnswer":{"@type":"Answer","text":"The best places to see Christmas lights in Mckinney this season include Christmas in The Square 2026- Choreographed Light Show Presented by CoServ (Nov 20 – Dec 4), Lights on the Farmstead Returns to Plano’s Heritage Farmstead Museum (Nov 20 – Dec 30) and Christmas in The Square- Light Tunnel (Nov 22–30)."}},{"@type":"Question","name":"Are there Christmas markets in Mckinney in 2026?","acceptedAnswer":{"@type":"Answer","text":"Yes, Mckinney has Christmas markets and holiday fairs this season, including HOLIDAY MARKET AT THE OMNI DALLAS at Omni Dallas Hotel (Sat, Nov 28), A Very Merry Village Holiday Market at The Glen Lawn (Fri, Dec 4) and Dallas Brunch with Santa + Holiday Market at The Rustic (Sat, Dec 5)."}},{"@type":"Question","name":"Where can kids meet Santa in Mckinney?","acceptedAnswer":{"@type":"Answer","text":"Kids can meet Santa in Mckinney at Professional Santa Portraits by Hart and Guin Photography (Nov 21–28), Christmas on the Square (Tue, Dec 1) and Saint Nick's Suite Escape at Virgin Hotels Dallas (Dec 2–23)."}},{"@type":"Question","name":"Where can I hear Christmas carols and see the Nutcracker in Mckinney?","acceptedAnswer":{"@type":"Answer","text":"Christmas concerts, carols and Nutcracker performances in Mckinney this season include A Christmas Carol at Dee and Charles Wyly Theatre (Nov 27 – Dec 27), Avant Chamber Ballet - The Nutcracker at Moody Performance Hall (Nov 29 – Dec 6) and The Royal Ballet: The Nutcracker (Dec 2–6)."}},{"@type":"Question","name":"Are there free Christmas events in Mckinney?","acceptedAnswer":{"@type":"Answer","text":"Yes, there are free Christmas events in Mckinney this season, including Dallas, TX - Ugly Christmas Sweater Pop Up @ Punch Bowl Social at Punch Bowl Social Dallas, Winter Wonderland: Holiday Kickoff Party and HOLIDAY MARKET AT THE OMNI DALLAS at Omni Dallas Hotel."}},{"@type":"Question","name":"What is open on Christmas Eve and Christmas Day in Mckinney?","acceptedAnswer":{"@type":"Answer","text":"On Christmas Eve and Christmas Day in Mckinney, you can go to Global Grooves | Biggest XMAS Bash at Club Vivo (Dec 24–25)."}},{"@type":"Question","name":"Are there Christmas events near Mckinney?","acceptedAnswer":{"@type":"Answer","text":"Yes, there are Christmas events in the towns near Mckinney, including Grapevine and Dallas."}},{"@type":"Question","name":"When do Christmas events start in Mckinney in 2026?","acceptedAnswer":{"@type":"Answer","text":"Christmas events in Mckinney start in mid to late November, when the first markets and tree lightings open. Most light displays and Santa visits run from late November to Christmas Eve, and the busiest weekends are the first three of December."}},{"@type":"Question","name":"Do I need to book Christmas events in Mckinney in advance?","acceptedAnswer":{"@type":"Answer","text":"Yes, for anything with a time slot: Santa visits, ticketed light trails, the Nutcracker and carol concerts in Mckinney often sell out on December weekends. Markets and drive-through lights are usually walk-up, though some sell timed entry on Saturdays."}},{"@type":"Question","name":"What should I wear to Christmas events in Mckinney?","acceptedAnswer":{"@type":"Answer","text":"For outdoor Christmas markets and light shows in Mckinney, wear warm layers, waterproof boots and a hat and gloves. Holiday parties call for velvet, satin or a little sparkle, and an ugly Christmas sweater for the themed ones."}},{"@type":"Question","name":"What can families do on Christmas Day in Mckinney?","acceptedAnswer":{"@type":"Answer","text":"On Christmas Day in Mckinney, families can go to church services, Christmas brunches and dinners, and light displays, which often stay open that night. Most shops, markets and attractions close, so check the date on each event."}}]}</script></head><body>
