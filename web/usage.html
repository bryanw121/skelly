<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Skelly · Usage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><h1>Skel<span>ly</span></h1><a class="back" href="./">← Schedule</a></div>
  </div>
</header>
<main>
  <div class="wrap">
    <!-- Locked: the owner pastes STATS_KEY once; the device keeps it. -->
    <form id="lock" class="us-lock" hidden>
      <div class="src-head"><h2>Usage</h2></div>
      <p class="src-lede">This page is for Skelly's owner.</p>
      <label class="us-lbl" for="key">Owner key</label>
      <input id="key" class="us-key" type="password" autocomplete="current-password" required>
      <button type="submit" class="us-go">Unlock</button>
      <p class="us-msg" id="lockMsg" role="alert"></p>
    </form>
    <!-- Unlocked: totals for Today, 7 or 30 days, refreshed every minute while shown. -->
    <section id="stats" hidden>
      <div class="src-head"><h2>Usage</h2>
        <div class="seg" role="group" aria-label="Span" id="spans"><button type="button" class="seg-btn" data-days="1" aria-pressed="false">Today</button><button type="button" class="seg-btn" data-days="7" aria-pressed="true">7 days</button><button type="button" class="seg-btn" data-days="30" aria-pressed="false">30 days</button></div>
      </div>
      <p class="src-lede" id="asof">Loading…</p>
      <div class="us-kpis">
        <div class="us-kpi"><span>Online now</span><b class="us-live" id="k-online">—</b></div>
        <div class="us-kpi"><span>Visitors</span><b id="k-visitors">—</b></div>
        <div class="us-kpi"><span>Visits</span><b id="k-visits">—</b></div>
        <div class="us-kpi"><span>Came back</span><b id="k-returning">—</b></div>
        <div class="us-kpi"><span>Busiest minute</span><b id="k-busiest">—</b><small id="k-busiest-at"></small></div>
      </div>
      <div class="us-card"><h3>Visitors per day</h3><div id="daily" class="us-daily"></div></div>
      <div class="us-grid">
        <div class="us-card"><h3>What they look at</h3><div id="uses" class="us-bars"></div></div>
        <div class="us-card"><h3>Where from</h3><div id="cities" class="us-bars"></div></div>
      </div>
      <div class="us-card"><h3>Top searches</h3><p class="us-note">Highlighted ones found nothing.</p><div id="searches"></div></div>
      <div class="us-grid">
        <div class="us-card"><h3>Taps out</h3><div id="outs" class="us-bars"></div></div>
        <div class="us-card"><h3>Devices</h3><div id="devices" class="us-bars"></div></div>
      </div>
      <p class="us-note"><button type="button" class="us-forget" id="forget">Lock this device</button></p>
    </section>
  </div>
</main>
<script type="module" src="usage-page.js"></script>
</body>
</html>
